name: Dang video anh Trang Facebook

on:
  # Make 8074072 da TAT 22/10 -> bot nay dang thay. Dung bat lai Make (dang trung).
  # 23/10 anh duyet tang giai tri: 3 video (12h, 16h, 20h) + 2 anh (9h, 17h) moi ngay
  schedule:
    # 07/11 (anh duyet theo so lieu): Trang 1, 2 tu 5 xuong 4 video/ngay, don ve chieu toi (20h xem nhieu nhat, 9h it nhat).
    # Truoc: 9h anh, 12h, 16h, 17h anh, 20h. Khung "anh" (gio UTC 2, 10) da bo -> khong con dang anh (kho anh dang trong).
    - cron: "0 5 * * *"            # 12h gio VN: video
    - cron: "0 9 * * *"            # 16h gio VN: video
    - cron: "0 11 * * *"           # 18h gio VN: video
    - cron: "0 13 * * *"           # 20h gio VN: video
    # 25/10 Trang 2: cung lich, LECH 30 phut (phut 30 = Trang 2), dang file SO CHAN
    - cron: "30 5 * * *"           # 12h30: video
    - cron: "30 9 * * *"           # 16h30: video
    - cron: "30 11 * * *"          # 18h30: video
    - cron: "30 13 * * *"          # 20h30: video
    # 04/11 Trang 3 (do gia dung, nick moi): phut 45, chi video, TANG DAN (dang_trang.py QUOTA3/HANG3: tuan 1 = 11h, 15h, 20h)
    - cron: "45 0 * * *"           # 7h45
    - cron: "45 2 * * *"           # 9h45
    - cron: "45 4 * * *"           # 11h45
    - cron: "45 6 * * *"           # 13h45
    - cron: "45 8 * * *"           # 15h45
    - cron: "45 11 * * *"          # 18h45
    - cron: "45 13 * * *"          # 20h45
    - cron: "45 15 * * *"          # 22h45
    # THEM TRANG MOI: chon 1 phut chua dung (vd 5, 50), them 8 dong cron phut do + muc trong trang_rieng.json ("phut")
    # 04/11 Trang 4 "Do Gia dung va cac meo hay" (don dep, sap xep nha cua; cung nick Trang 3): phut 15, chi video, TANG DAN
    # (dang_trang.py RIENG["4"]["hang"]: tuan 1 = 12h, 21h, 16h)
    - cron: "15 1 * * *"           # 8h15
    - cron: "15 3 * * *"           # 10h15
    - cron: "15 5 * * *"           # 12h15
    - cron: "15 7 * * *"           # 14h15
    - cron: "15 9 * * *"           # 16h15
    - cron: "15 12 * * *"          # 19h15
    - cron: "15 14 * * *"          # 21h15
    - cron: "15 16 * * *"          # 23h15
    # 05/11 Trang 5 "Suc khoe La Tat ca" (dong tac gian co + dung cu suc khoe; cung nick Pham Hoang): phut 50, chi video, TANG DAN
    # (trang_rieng.json "5" hang: tuan 1 = 11h50, 20h50, 6h50)
    - cron: "50 23 * * *"          # 6h50
    - cron: "50 0 * * *"           # 7h50
    - cron: "50 2 * * *"           # 9h50
    - cron: "50 4 * * *"           # 11h50
    - cron: "50 7 * * *"           # 14h50
    - cron: "50 10 * * *"          # 17h50
    - cron: "50 13 * * *"          # 20h50
    - cron: "50 15 * * *"          # 22h50
  workflow_dispatch:
    inputs:
      trang:
        description: "So Trang (1 = Ngam Doi Ma Song, 2 = Song Cham Nghi Sau, 3 = Bep Nha Meo Hay, 4 = Do Gia dung va cac meo hay, 5+ = trang_rieng.json)"
        type: string
        default: "1"
      kieu:
        description: "Dang gi"
        type: choice
        options: [video, anh]
        default: anh
      an:
        description: "Dang THU bai an roi xoa ngay (khong chuyen file)"
        type: boolean
        default: true
      dry_run:
        description: "Chi xem se dang file nao, KHONG dang"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dang-trang
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests google-auth
      - name: Dang Trang Facebook
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE2_ID: ${{ secrets.FB_PAGE2_ID }}
          FB_PAGE2_TOKEN: ${{ secrets.FB_PAGE2_TOKEN }}
          FB_PAGE3_ID: ${{ secrets.FB_PAGE3_ID }}
          FB_PAGE3_TOKEN: ${{ secrets.FB_PAGE3_TOKEN }}
          SECRETS_JSON: ${{ toJSON(secrets) }}   # 04/11: Trang 4 tro di doc FB_PAGE<N>_ID/_TOKEN o day (them Trang khong sua yml env)
          SLOT: ${{ github.event.schedule }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 27/10: tu dat so + AI viet tieu de file moi
          ACCESSTRADE_TOKEN: ${{ secrets.ACCESSTRADE_TOKEN }}   # 04/11 Trang 3: link TikTok Shop o binh luan
          TRANG: ${{ github.event_name == 'workflow_dispatch' && inputs.trang || '' }}   # lich: dang_trang.py tu tinh theo phut cron (trang_rieng.json)
          KIEU: ${{ github.event_name == 'workflow_dispatch' && inputs.kieu || ((endsWith(github.event.schedule, ' 2 * * *') || endsWith(github.event.schedule, ' 10 * * *')) && 'anh' || 'video') }}
          AN: ${{ inputs.an && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python dang_trang.py
      - name: Luu trang thai da dang
        if: always()
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add dang_trang.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "cap nhat dang trang"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi
