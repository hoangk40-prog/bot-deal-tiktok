name: San ma Shopee moi ngay

on:
  schedule:
    - cron: "30 4 * * *"           # 11h30 gio VN: tin "San ma Shopee hom nay" (truoc gio mo ma 12h)
    - cron: "30 15 10 11 *"        # 22h30 dem 10/11: tin "Chuan bi 0h 11.11"
    - cron: "30 15 11 12 *"        # 22h30 dem 11/12: tin "Chuan bi 0h 12.12"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chay thu: chi in tin ra log, KHONG gui"
        type: boolean
        default: true
      chuan_bi:
        description: "Gui kieu 'Chuan bi 0h' (dem truoc ngay doi)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: san-ma
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pillow
      - name: Gui tin san ma
        env:
          ACCESSTRADE_TOKEN: ${{ secrets.ACCESSTRADE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE2_ID: ${{ secrets.FB_PAGE2_ID }}
          FB_PAGE2_TOKEN: ${{ secrets.FB_PAGE2_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          KIEU: ${{ (inputs.chuan_bi || startsWith(github.event.schedule, '30 15')) && 'chuan_bi' || '' }}
        run: python san_ma.py
      - name: Luu trang thai
        if: always()
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add san_ma.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "cap nhat san ma"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi
